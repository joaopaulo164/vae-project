[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vae-project"
version = "0.1.0"
description = "Variational Autoencoder study for MNIST and Fashion-MNIST datasets"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.4.0",
    "umap-learn>=0.5.5",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "PyYAML>=6.0.1",
    "tqdm>=4.66.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "black>=24.4.0",
    "mypy>=1.10.0",
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "bandit>=1.7.8",
    "pre-commit>=3.7.0",
    "types-PyYAML>=6.0.12",
    "types-tqdm>=4.66.0",
    "pandas-stubs>=2.2.0",
]

[project.scripts]
vae-project = "vae_project.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "ANN", # flake8-annotations (partial)
    "S",   # flake8-bandit (security)
    "PT",  # flake8-pytest-style
    "RUF", # ruff-specific rules
]
ignore = [
    "ANN101",  # missing type annotation for self (removed in ruff 0.4)
    "ANN102",  # missing type annotation for cls (removed in ruff 0.4)
    "ANN001",  # missing type annotation for function argument (relaxed)
    "ANN401",  # dynamically typed expressions
    "S101",    # use of assert (allowed in tests)
    "S311",    # pseudo-random for non-security use
    "UP042",   # replace-str-enum (compatibility concern)
    "E501",    # line-too-long (managed by Black)
    "ANN201",  # missing return type annotation for public function
    "ANN202",  # missing return type annotation for private function
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ANN", "S311"]

[tool.ruff.lint.isort]
known-first-party = ["vae_project"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["vae_project"]
strict = false
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = [
    "torchvision.*",
    "umap.*",
    "sklearn.*",
    "seaborn.*",
    "matplotlib.*",
    "psutil.*",
    "tqdm.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: fast unit tests",
    "integration: integration tests",
    "slow: slow tests (e.g. full training)",
    "requires_cuda: tests that require CUDA GPU",
]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/vae_project"]
omit = ["*/tests/*", "*/__main__.py"]

[tool.coverage.report]
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
