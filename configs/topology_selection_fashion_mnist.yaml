# topology_selection_fashion_mnist.yaml — Topology selection for Fashion-MNIST.

project:
  name: vae_project
  description: "Fashion-MNIST topology selection experiment"
  quick_mode: false

dataset:
  name: fashion_mnist
  download: true
  num_workers: 0

model:
  latent_dimension: 16
  topology:
    name: medium
    hidden_dimensions: [512, 256]

loss:
  reconstruction_loss_type: bce
  beta: 1.0
  reduction: sum

supervised_component:
  enabled: false

training:
  max_epochs: 30
  batch_size: 128

early_stopping:
  enabled: true
  patience: 8

optimizer:
  learning_rate: 0.001

runtime:
  device: auto

reproducibility:
  global_seed: 42
