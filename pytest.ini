[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: fast unit tests (no downloads, no GPU)
    integration: integration tests (synthetic data, no downloads)
    slow: slow tests (full training, may take minutes)
    requires_cuda: tests that require a CUDA GPU
addopts = -v --tb=short -m "not requires_cuda"
